<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagan Pertandingan Badminton - Display TV & Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: linear-gradient(135deg, #000428 0%, #004e92 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden; /* Lebih aman daripada auto */
            position: relative;
        }

        /* Navigasi Utama (Mobile-Friendly) */
        .main-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 4, 40, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            gap: 15px; /* Lebih banyak gap */
            padding: 15px 0; /* Lebih banyak padding vertikal */
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .main-nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem; /* Sedikit lebih besar */
            padding: 12px 20px; /* Lebih banyak padding untuk target sentuh */
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .main-nav a:hover, .main-nav a.active {
            background: #00f2fe;
            color: #000428;
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        /* Container Tombol Kontrol (Mobile-Friendly) */
        .controls-container {
            position: absolute;
            top: 75px;
            right: 25px;
            display: flex;
            gap: 15px; /* Lebih banyak gap */
            z-index: 100;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 15px 25px; /* Lebih banyak padding untuk sentuhan yang lebih mudah */
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            font-size: 1.1rem; /* Sedikit lebih besar */
            font-weight: 800;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-control:hover {
            background: rgba(255, 255, 255, 0.35);
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
            transform: scale(1.05);
        }

        .btn-reset { display: none; }
        .btn-reset:hover {
            border-color: #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
        }

        /* Sembunyikan navigasi & kontrol saat Fullscreen aktif */
        :fullscreen .controls-container, :-webkit-full-screen .controls-container,
        :fullscreen .main-nav, :-webkit-full-screen .main-nav {
            display: none !important;
        }

        :fullscreen, :fullscreen * { cursor: none !important; }
        :-webkit-full-screen, :-webkit-full-screen * { cursor: none !important; }

        /* Pembungkus Konten Utama (Pemusatan Vertikal di Fullscreen) */
        .main-content-wrapper {
            flex-grow: 1; /* Ambil sisa ruang */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Pusatkan secara vertikal */
            align-items: center; /* Pusatkan secara horizontal */
            width: 100%;
            max-width: 1900px;
            padding: 110px 20px 35px 20px; /* Padding untuk Navbar di mode normal */
        }
        
        /* Hapus padding atas saat Fullscreen */
        :fullscreen .main-content-wrapper, :-webkit-full-screen .main-content-wrapper {
            padding: 20px;
        }

        /* Header Utama */
        .header { text-align: center; margin-bottom: 40px; text-transform: uppercase; }
        .header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 50%, #ffb703 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(0, 242, 254, 0.5);
        }

        /* Container Bagan Desktop (Grid Responsif) */
        .bracket-container {
            display: grid;
            /* Ganti piksel tetap dengan fraksi grid yang responsif */
            grid-template-columns: 1.5fr 1fr 1.6fr 1fr 1.5fr; 
            gap: 15px; /* Sedikit lebih sedikit gap untuk TV */
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
            min-height: 680px;
        }

        .round-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f2fe;
            margin-bottom: 18px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        /* Box Match */
        .match-box {
            background: rgba(255, 255, 255, 0.14);
            border: 2px solid rgba(255, 255, 255, 0.28);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            box-shadow: 0 14px 45px 0 rgba(0, 0, 0, 0.45);
            padding: 18px;
            transition: all 0.3s ease;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.42);
            border-radius: 12px;
            padding: 14px 18px;
            margin: 8px 0;
            border-left: 8px solid #00f2fe;
        }

        .team-row.away { border-left-color: #ff007f; }

        .team-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.55rem;
            font-weight: 800;
            width: 100%;
            outline: none;
            font-family: inherit;
            text-transform: uppercase;
        }

        .score-input {
            background: rgba(255, 255, 255, 0.22);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            width: 58px;
            height: 52px;
            outline: none;
            margin-left: 14px;
        }

        input[readonly] { cursor: default; user-select: none; }

        .center-column { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 35px; }
        .final-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .final-box { width: 100%; border: 3px solid rgba(255, 215, 0, 0.85); box-shadow: 0 0 45px rgba(255, 215, 0, 0.4); }

        .champion-box {
            background: linear-gradient(135deg, rgba(255, 183, 3, 0.3) 0%, rgba(255, 215, 0, 0.12) 100%);
            border: 3px solid #ffb703;
            border-radius: 24px;
            backdrop-filter: blur(16px);
            padding: 26px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 183, 3, 0.5);
        }

        .trophy-icon { font-size: 4.5rem; margin-bottom: 8px; }
        .champion-title { font-size: 1.35rem; letter-spacing: 3px; color: #ffb703; font-weight: 900; text-transform: uppercase; }
        .champion-input { text-align: center; font-size: 2.1rem; font-weight: 900; color: #ffffff; margin-top: 10px; }

        /* Mobile Layout */
        @media (max-width: 1024px) {
            .header { margin-bottom: 28px; }
            .header h1 { font-size: 2.1rem; }
            
            /* Sederhanakan Navbar di Seluler */
            .main-nav {
                flex-wrap: wrap;
                gap: 10px;
                padding: 10px;
                position: fixed; /* Taruh di bawah untuk mobile sentuh */
                top: auto;
                bottom: 0;
                border-bottom: none;
                border-top: 1px solid rgba(255, 255, 255, 0.15);
            }
            
            .main-nav a {
                padding: 10px 15px;
                font-size: 1rem;
            }

            /* Sederhanakan Tombol Kontrol di Seluler */
            .controls-container {
                position: relative;
                top: auto;
                right: auto;
                width: 100%;
                justify-content: center;
                margin-top: 20px;
                margin-bottom: 25px;
                flex-wrap: wrap; /* Tumpuk tombol kontrol */
                gap: 10px;
            }
            
            .btn-control {
                padding: 12px 20px;
                font-size: 1rem;
            }

            .main-content-wrapper {
                padding: 20px 12px 80px 12px; /* Lebih sedikit padding, tambah di bawah untuk nav */
                justify-content: flex-start; /* Jangan pusatkan vertikal di mobile */
            }

            .bracket-container { display: flex; flex-direction: column; gap: 28px; }
            .round { min-height: auto; gap: 18px; }
            .round-title { font-size: 1.45rem; }
            
            /* Tata ulang urutan untuk tampilan tumpuk seluler */
            .round-8-left { order: 1; }
            .round-8-right { order: 2; }
            .round-semi-left { order: 3; }
            .round-semi-right { order: 4; }
            .center-column { order: 5; gap: 25px; }

            /* Sesuaikan ukuran input di seluler */
            .team-input { font-size: 1.3rem; }
            .score-input { width: 52px; height: 46px; font-size: 1.45rem; }
            .trophy-icon { font-size: 3.8rem; }
            .champion-title { font-size: 1.2rem; }
            .champion-input { font-size: 1.65rem; }
        }
    </style>
</head>
<body>

    <!-- Navigasi Utama -->
    <nav class="main-nav">
        <a href="index.html" class="active">🏆 Bagan Pertandingan</a>
        <a href="scoreboard.html">📺 Display Scoreboard</a>
        <a href="remote.html">📱 Remote Control</a>
    </nav>

    <!-- Tombol Kontrol -->
    <div class="controls-container">
        <button class="btn-control" id="btn-admin" onclick="toggleAdminMode()">🔒 Login Panitia</button>
        <button class="btn-control btn-reset" id="btn-reset" onclick="resetData()">🗑️ Reset Data</button>
        <button class="btn-control" onclick="toggleFullScreen()">📺 Full Screen</button>
    </div>

    <!-- Pembungkus Konten Utama -->
    <div class="main-content-wrapper">
        <div class="header">
            <h1>Turnamen Badminton Hari Radio ke 81</h1>
        </div>

        <div class="bracket-container">
            <!-- 8 BESAR (KIRI) -->
            <div class="round round-8-left">
                <div class="round-title">8 Besar (Kiri)</div>
                <div class="match-box">
                    <div class="team-row"><input type="text" class="team-input" value="TIM A1"><input type="number" class="score-input" value="0"></div>
                    <div class="team-row away"><input type="text" class="team-input" value="TIM A2"><input type="number" class="score-input" value="0"></div>
                </div>
                <div class="match-box">
                    <div class="team-row"><input type="text" class="team-input" value="TIM B1"><input type="number" class="score-input" value="0"></div>
                    <div class="team-row away"><input type="text" class="team-input" value="TIM B2"><input type="number" class="score-input" value="0"></div>
                </div>
            </div>

            <!-- SEMIFINAL (KIRI) -->
            <div class="round round-semi-left">
                <div class="round-title">Semifinal (Kiri)</div>
                <div class="match-box">
                    <div class="team-row"><input type="text" class="team-input" value="PEMENANG A"><input type="number" class="score-input" value="0"></div>
                    <div class="team-row away"><input type="text" class="team-input" value="PEMENANG B"><input type="number" class="score-input" value="0"></div>
                </div>
            </div>

            <!-- FINAL & JUARA (TENGAH) -->
            <div class="center-column">
                <div class="champion-box">
                    <div class="trophy-icon">🏆</div>
                    <div class="champion-title">Juara Utama</div>
                    <input type="text" class="team-input champion-input" value="NAMA JUARA">
                </div>
                <div class="final-wrapper">
                    <div class="round-title" style="margin-bottom: 14px; font-size: 1.8rem;">FINAL</div>
                    <div class="match-box final-box">
                        <div class="team-row"><input type="text" class="team-input" value="FINALIS KIRI"><input type="number" class="score-input" value="0"></div>
                        <div class="team-row away"><input type="text" class="team-input" value="FINALIS KANAN"><input type="number" class="score-input" value="0"></div>
                    </div>
                </div>
            </div>

            <!-- SEMIFINAL (KANAN) -->
            <div class="round round-semi-right">
                <div class="round-title">Semifinal (Kanan)</div>
                <div class="match-box">
                    <div class="team-row"><input type="text" class="team-input" value="PEMENANG C"><input type="number" class="score-input" value="0"></div>
                    <div class="team-row away"><input type="text" class="team-input" value="PEMENANG D"><input type="number" class="score-input" value="0"></div>
                </div>
            </div>

            <!-- 8 BESAR (KANAN) -->
            <div class="round round-8-right">
                <div class="round-title">8 Besar (Kanan)</div>
                <div class="match-box">
                    <div class="team-row"><input type="text" class="team-input" value="TIM C1"><input type="number" class="score-input" value="0"></div>
                    <div class="team-row away"><input type="text" class="team-input" value="TIM C2"><input type="number" class="score-input" value="0"></div>
                </div>
                <div class="match-box">
                    <div class="team-row"><input type="text" class="team-input" value="TIM D1"><input type="number" class="score-input" value="0"></div>
                    <div class="team-row away"><input type="text" class="team-input" value="TIM D2"><input type="number" class="score-input" value="0"></div>
                </div>
            </div>
        </div>
    </div> <!-- Akhir Pembungkus Konten Utama -->

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const ADMIN_PIN = "1234";
        let isAdmin = false;

        const firebaseConfig = {
            apiKey: "AIzaSyAJoXlc5EP9LmbINBvlJfsVJPDdlEgJY1o",
            authDomain: "bagan-badminton.firebaseapp.com",
            databaseURL: "https://bagan-badminton-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bagan-badminton",
            storageBucket: "bagan-badminton.firebasestorage.app",
            messagingSenderId: "776101992812",
            appId: "1:776101992812:web:554e0e50d1528cc530fb49",
            measurementId: "G-G0T4KYS4W2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const bracketRef = db.ref('badminton_bracket');

        const allInputs = document.querySelectorAll('input');

        function setReadOnlyState(isReadOnly) {
            allInputs.forEach(input => input.readOnly = isReadOnly);
        }
        setReadOnlyState(true);

        allInputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (isAdmin) {
                    bracketRef.child(index).set(input.value);
                }
            });
        });

        bracketRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach((index) => {
                    if (allInputs[index] && allInputs[index].value !== data[index]) {
                        allInputs[index].value = data[index];
                    }
                });
            }
        });

        function toggleAdminMode() {
            if (!isAdmin) {
                const inputPin = prompt("Masukkan PIN Panitia untuk mengedit:");
                if (inputPin === ADMIN_PIN) {
                    isAdmin = true;
                    setReadOnlyState(false);
                    document.getElementById('btn-admin').innerText = "🔓 Keluar Panitia";
                    document.getElementById('btn-reset').style.display = "inline-block";
                    alert("Akses diberikan! Anda sekarang dapat mengedit bagan.");
                } else if (inputPin !== null) {
                    alert("PIN Salah! Akses ditolak.");
                }
            } else {
                isAdmin = false;
                setReadOnlyState(true);
                document.getElementById('btn-admin').innerText = "🔒 Login Panitia";
                document.getElementById('btn-reset').style.display = "none";
                alert("Anda telah keluar dari Mode Panitia.");
            }
        }

        function resetData() {
            if (!isAdmin) return;
            if (confirm("Apakah Anda yakin ingin mereset bagan di SEMUA device?")) {
                bracketRef.remove().then(() => location.reload());
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
